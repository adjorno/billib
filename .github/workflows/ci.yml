name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run ktlint (all modules)
        run: ./gradlew ktlintCheck

      - name: Run detekt (frontend multiplatform modules)
        run: ./gradlew detektMetadataCommonMain

      # Backend/libraries detekt - Disabled due to Kotlin version incompatibility
      # detekt 1.23.8 was compiled with Kotlin 2.0.21, but project uses Kotlin 2.3.0
      # Uncomment when detekt 2.0.0+ is released to stable repositories
      # - name: Run detekt (backend/libraries)
      #   run: ./gradlew :backend:detekt :libraries:billib-importer:detekt :libraries:data-source:billboard:detekt

      - name: Run unit tests
        run: ./gradlew test
