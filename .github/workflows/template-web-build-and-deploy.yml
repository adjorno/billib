name: Build and Deploy Web App

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string for the build'
        required: true
        type: string
      cloudflare_project_name:
        description: 'Cloudflare Pages project name'
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      FB_WEB_API_KEY:
        required: true
      APPLE_MUSIC_TOKEN:
        required: true

jobs:
  deploy:
    name: Build and Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build WASM distribution
        run: |
          ./gradlew :frontend:composeApp:wasmJsBrowserDistribution \
            -PVERSION_NAME=${{ inputs.version }} \
            -PFIREBASE_API_KEY=${{ secrets.FB_WEB_API_KEY }} \
            -PAPPLE_MUSIC_TOKEN=${{ secrets.APPLE_MUSIC_TOKEN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./frontend/composeApp/build/dist/wasmJs/productionExecutable --project-name=${{ inputs.cloudflare_project_name }} --branch main
