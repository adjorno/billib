<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M14N</title>
    <meta name="description" content="Billboard Charts">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <!-- Splash screen resources -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7c4dff",
                        "background-dark": "#140f23",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #140f23;
        }
    </style>
</head>
<body class="font-display text-slate-100 antialiased">

    <!-- Splash screen (all visual logic lives in splash-screen.js) -->
    <script src="splash-screen.js"></script>

    <!-- iTunes JSONP Static Bridge -->
    <script>
        // Static global dispatcher for iTunes Search API JSONP requests
        // Handles dynamic callback registration without requiring dynamic code generation
        window.itunesDispatcher = {
            counter: 0,

            search: function(term, onResult) {
                const id = "itunes_cb_" + (this.counter++);
                const script = document.createElement('script');

                console.log('[iTunes Bridge] Starting search:', term, 'callback:', id);

                // Register temporary global callback for this specific request
                window[id] = function(data) {
                    console.log('[iTunes Bridge] Callback invoked:', id);

                    // Pass result back to Kotlin as JSON string
                    onResult(JSON.stringify(data));

                    // Cleanup
                    delete window[id];
                    script.remove();

                    console.log('[iTunes Bridge] Cleaned up:', id);
                };

                // Build and inject script tag
                const url = 'https://itunes.apple.com/search?term=' +
                           encodeURIComponent(term) +
                           '&entity=song&limit=1&callback=' + id;

                script.src = url;
                script.onerror = function() {
                    console.error('[iTunes Bridge] Script load error');
                    delete window[id];
                    script.remove();
                    onResult(null); // Signal error
                };

                document.body.appendChild(script);
                console.log('[iTunes Bridge] Script injected:', url);
            }
        };

        // Top-level wrapper for Kotlin/Wasm external function
        function searchItunesInternal(term, callback) {
            window.itunesDispatcher.search(term, callback);
        }

        console.log('[iTunes Bridge] Static dispatcher initialized');
    </script>

    <!-- localStorage Bridge for Artwork Persistence -->
    <script>
        function jsLocalStorageGet(key) {
            return localStorage.getItem(key);
        }

        function jsLocalStorageSet(key, value) {
            localStorage.setItem(key, value);
        }

        console.log('[localStorage Bridge] Initialized');
    </script>

    <script src="composeApp.js"></script>
</body>
</html>
