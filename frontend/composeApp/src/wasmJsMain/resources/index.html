<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M14N</title>
    <meta name="description" content="Billboard Charts">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <!-- Splash screen resources -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7c4dff",
                        "background-dark": "#140f23",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #140f23;
        }
    </style>
</head>
<body class="font-display text-slate-100 antialiased">

    <!-- Splash screen (all visual logic lives in splash-screen.js) -->
    <script src="splash-screen.js"></script>

    <!-- localStorage Bridge for Artwork Persistence -->
    <script>
        function jsLocalStorageGet(key) {
            return localStorage.getItem(key);
        }

        function jsLocalStorageSet(key, value) {
            localStorage.setItem(key, value);
        }

        console.log('[localStorage Bridge] Initialized');
    </script>

    <!-- Firebase compat SDK (sync <script> → guaranteed before composeApp.js) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script>
        function jsFirebaseInit(apiKey, projectId, appId, authDomain) {
            firebase.initializeApp({ apiKey: apiKey, projectId: projectId, appId: appId, authDomain: authDomain });
        }
        function jsUseFirebaseEmulator() {
            firebase.auth().useEmulator("http://localhost:9099");
        }
        function jsSignInAnonymously() {
            return firebase.auth().signInAnonymously();
        }
        function jsGetIdToken() {
            const user = firebase.auth().currentUser;
            return user ? user.getIdToken(false) : Promise.resolve(null);
        }
        function jsGetIsAnonymous() {
            const user = firebase.auth().currentUser;
            return user ? user.isAnonymous : true;
        }
        function jsIsSignedIn() {
            return firebase.auth().currentUser !== null;
        }
        function jsLinkWithEmail(email, password) {
            const user = firebase.auth().currentUser;
            const cred = firebase.auth.EmailAuthProvider.credential(email, password);
            return user ? user.linkWithCredential(cred)
                        : firebase.auth().createUserWithEmailAndPassword(email, password);
        }
        function jsSignInWithEmail(email, password) {
            return firebase.auth().signInWithEmailAndPassword(email, password);
        }
        function jsSignInWithGoogle() {
            const user = firebase.auth().currentUser;
            const provider = new firebase.auth.GoogleAuthProvider();
            return user ? user.linkWithRedirect(provider) : firebase.auth().signInWithRedirect(provider);
        }
        function jsSignInWithApple() {
            const user = firebase.auth().currentUser;
            const provider = new firebase.auth.OAuthProvider('apple.com');
            return user ? user.linkWithRedirect(provider) : firebase.auth().signInWithRedirect(provider);
        }
        async function jsGetRedirectResult() {
            try {
                await firebase.auth().getRedirectResult();
            } catch (error) {
                if (error.code === 'auth/credential-already-in-use' && error.credential) {
                    await firebase.auth().signInWithCredential(error.credential);
                }
            }
        }
        function jsOnAuthStateChanged(callback) {
            firebase.auth().onAuthStateChanged(function(user) {
                callback(user !== null && !user.isAnonymous);
            });
        }
        function jsConsoleError(msg) {
            console.error(msg);
        }
        console.log('[Firebase Bridge] Initialized');
    </script>

    <script src="composeApp.js"></script>
</body>
</html>
