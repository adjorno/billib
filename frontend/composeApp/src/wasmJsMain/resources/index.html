<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M14N</title>
    <meta name="description" content="Billboard Charts">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <!-- Splash screen resources -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7c4dff",
                        "background-dark": "#140f23",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #140f23;
        }
    </style>
</head>
<body class="font-display text-slate-100 antialiased">

    <!-- Splash screen (all visual logic lives in splash-screen.js) -->
    <script src="splash-screen.js"></script>

    <!-- localStorage Bridge for Artwork Persistence -->
    <script>
        function jsLocalStorageGet(key) {
            return localStorage.getItem(key);
        }

        function jsLocalStorageSet(key, value) {
            localStorage.setItem(key, value);
        }

        console.log('[localStorage Bridge] Initialized');
    </script>

    <script src="composeApp.js"></script>
</body>
</html>
