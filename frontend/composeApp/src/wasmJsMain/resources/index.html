<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billib</title>
    <meta name="description" content="Billboard Charts - Kotlin Multiplatform">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1A1A1A;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #7F52FF;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Billib...</div>

    <!-- iTunes JSONP Static Bridge -->
    <script>
        // Static global dispatcher for iTunes Search API JSONP requests
        // Handles dynamic callback registration without requiring dynamic code generation
        window.itunesDispatcher = {
            counter: 0,

            search: function(term, onResult) {
                const id = "itunes_cb_" + (this.counter++);
                const script = document.createElement('script');

                console.log('[iTunes Bridge] Starting search:', term, 'callback:', id);

                // Register temporary global callback for this specific request
                window[id] = function(data) {
                    console.log('[iTunes Bridge] Callback invoked:', id);

                    // Pass result back to Kotlin as JSON string
                    onResult(JSON.stringify(data));

                    // Cleanup
                    delete window[id];
                    script.remove();

                    console.log('[iTunes Bridge] Cleaned up:', id);
                };

                // Build and inject script tag
                const url = 'https://itunes.apple.com/search?term=' +
                           encodeURIComponent(term) +
                           '&entity=song&limit=1&callback=' + id;

                script.src = url;
                script.onerror = function() {
                    console.error('[iTunes Bridge] Script load error');
                    delete window[id];
                    script.remove();
                    onResult(null); // Signal error
                };

                document.body.appendChild(script);
                console.log('[iTunes Bridge] Script injected:', url);
            }
        };

        // Top-level wrapper for Kotlin/Wasm external function
        function searchItunesInternal(term, callback) {
            window.itunesDispatcher.search(term, callback);
        }

        console.log('[iTunes Bridge] Static dispatcher initialized');
    </script>

    <script src="composeApp.js"></script>
</body>
</html>
